blueprint:
  name: TagTuner music player for NFC tags automation
  description: https://github.com/luka6000/TagTuner#using-tagtuner
  author: LukaGra v260901
  domain: automation
  input:
    tuner_id:
      name: TagTuner for ESPHome
      description: This is your NFC tuner device
      selector:
        device:
          filter:
            - integration: esphome
    event_action:
      name: TagTuner Action
      description: tracing TagTuner Related automation
      default: "event.tagtuner_action"
      selector:
        entity:
          filter:
            - integration: esphome
              domain: event
    massplayer:
      name: Music Assistant media player
      description: This is your MAss media player for this tuner
      default: "media_player.NO_MAss"
      selector:
        entity:
          filter:
            - integration: music_assistant
              domain: media_player
    httpplayer:
      name: Home Assistant media player
      description: Controls play/stop/volume and maybe plays http playlists. Choose same MAss media player as above in case you don't know better
      # default:
      selector:
        entity:
          filter:
            - domain: media_player
    video:
      name: Plex videos on Apple TV
      description: Optional. Lets plexvideo:// tags play Plex movies and shows on an Apple TV. Leave empty and video tags are ignored.
      collapsed: true
      input:
        appletv:
          name: Apple TV
          description: Apple TV media player from the Apple TV integration
          default: ""
          selector:
            entity:
              filter:
                - integration: apple_tv
                  domain: media_player
        plexplayer:
          name: Plex player on the Apple TV
          description: Plex integration media player for the Plex app on this Apple TV. Open Plex on the Apple TV once so it shows up
          default: ""
          selector:
            entity:
              filter:
                - integration: plex
                  domain: media_player
        plex_app_name:
          name: Plex app name
          description: as listed in the Apple TV sources
          default: Plex
        video_timeout:
          name: Startup timeout
          description: seconds to wait for Plex to wake up on the Apple TV
          default: 60
          selector:
            number:
              min: 10
              max: 180
              step: 5
              unit_of_measurement: s
    options:
      name: Additional settings
      collapsed: true
      input:
        stop_on_tagremoved:
          name: Stop music
          description: on tag removed
          selector:
            boolean:
          default: true
        next_on_rescan:
          name: Skip track
          description: on tag rescan
          selector:
            boolean:
          default: true
        shuffle_playlist:
          name: Shuffle
          description: every playlist
          selector:
            boolean:
          default: false
        default_volume_set:
          name: Default volume
          description: set on tag scanned
          selector:
            boolean:
          default: false
        default_volume:
          name: Default volume
          description: start playing with
          default: 0.3
          selector:
            number:
              min: 0.01
              max: 1
              step: 0.01
              mode: slider
        max_volume:
          name: Volume limiter
          description: maximum allowed
          default: 1
          selector:
            number:
              min: 0.01
              max: 1
              step: 0.01
              mode: slider
        announce_playlist:
          name: Announce
          description: every playlist
          selector:
            boolean:
          default: false
        speaktts:
          name: TTS engine
          description: for announcements
          selector:
            entity:
              filter:
                - domain: tts
          default: tts.home_assistant_cloud
        speaktts_language:
          name: TTS engine language
          description: might require changing
          default: en-US
        version:
          name: Blueprint version
          description: just for you to know
          default: 260901
        notify_version:
          name: Notify about version
          description: mismatch of automation vs yaml firmware
          selector:
            boolean:
          default: true

variables:
  tuner_device_id: !input tuner_id
  massplayer: !input massplayer
  httpplayer: !input httpplayer
  stop_on_tagremoved: !input stop_on_tagremoved
  next_on_rescan: !input next_on_rescan
  action: >-
    {%if trigger.event.event_type == 'tag_scanned' %}
      tagScanned
    {%elif trigger.event.data.action == 'tag_scanned' %}
      tagScanned
    {%elif trigger.event.data.action == 'tag_removed' %}
      tagRemoved
    {%elif trigger.event.data.action == 'volume_up' %}
      volumeUp
    {%elif trigger.event.data.action == 'volume_down' %}
      volumeDown
    {%else%}
      {{ trigger.event.data.action }}
    {%endif%}
  uri: >-
    {%if trigger.event.event_type == 'tag_scanned' %}
      {{ trigger.event.data.name }}
    {%else%}
      {{ trigger.event.data.uri }}
    {%endif%}
  source: >-
    {%if uri[0:12]=='plexvideo://' %}
      video
    {%elif uri[0:5]=='https' %}
      http
    {%elif uri[0:5]=='sonos' %}
      sonos
    {% elif uri is match('^(?:filesystem_local|filesystem_smb|apple_music|deezer|plex|qobuz|radiobrowser|soundcloud|spotify|tidal|tunein|ytmusic|library)(?:--.*)?://') %}
      mass
    {%endif%}
  playlist: >-
    {%if uri[-8:] == '/shuffle'%}
      {%set pl = uri[0:-8] %}
    {%else%}
      {%set pl = uri %}
    {%endif%}
    {{ pl.split('://')[1]}}
  text_playlist_uri: >-
    {% for entity in device_entities(tuner_device_id) %}
      {% if entity is match("^text..*_playlist_uri") %}
        {{ entity }}
      {% endif%}
    {% endfor%}
  text_playlist_artist: >-
    {% for entity in device_entities(tuner_device_id) %}
      {% if entity is match("^text..*_playlist_artist") %}
        {{ entity }}
      {% endif%}
    {% endfor%}
  text_playlist_name: >-
    {% for entity in device_entities(tuner_device_id) %}
      {% if entity is match("^text..*_playlist_name_or_album_title") %}
        {{ entity }}
      {% endif%}
    {% endfor%}
  announce_playlist: !input announce_playlist
  shuffle_config: !input shuffle_playlist
  shuffle_playlist: >-
    {%if shuffle_config == true
    or uri[-8:]=='/shuffle'
    %}{{true}}{%else%}{{false}}{%endif%}
  max_volume: !input max_volume
  notify_version: !input notify_version
  blprnt_version: !input version
  default_volume_set: !input default_volume_set
  default_volume: !input default_volume
  appletv: !input appletv
  plexplayer: !input plexplayer
  plex_app_name: !input plex_app_name
  video_timeout: !input video_timeout
  video_enabled: "{{ appletv not in ('', none) and plexplayer not in ('', none) }}"
  video_current: "{{ video_enabled and states(text_playlist_uri)[0:12] == 'plexvideo://' }}"
  appletv_remote: >-
    {%if video_enabled %}
      {{ device_entities(device_id(appletv)) | select('match', 'remote\.') | first | default('') }}
    {%endif%}
  plex_scan_button: >-
    {%if video_enabled %}
      {{ integration_entities('plex') | select('match', 'button\..*scan_clients') | first | default('') }}
    {%endif%}

triggers:
  - trigger: event
    event_type: esphome.tagtuner
  - trigger: event
    event_type: tag_scanned
  - trigger: state
    entity_id: !input event_action
    to:
      - "event action for TagTuner Related automation"
conditions:
  - condition: template
    value_template: "{{ trigger.event.data.device_id == tuner_device_id }}"
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ action == "tagRemoved" }}'
        sequence:
          - condition: template
            value_template: "{{ stop_on_tagremoved == true }}"
          - alias: videos keep playing when the tag is lifted
            condition: template
            value_template: "{{ not video_current }}"
          - action: media_player.media_pause
            target:
              entity_id: !input httpplayer
          - action: media_player.shuffle_set
            data:
              shuffle: false
            target:
              entity_id:
                - !input httpplayer
                - !input massplayer
        alias: tag_removed

      - conditions:
          - condition: template
            value_template: '{{ action == "tagScanned" and source == "video" }}'
        sequence:
          - condition: template
            value_template: "{{ video_enabled }}"
          - variables:
              video_request: "{{ uri[12:] | from_json(default={}) }}"
              video_show_in_order: >-
                {{ 'show_name' in video_request
                and 'season_number' not in video_request
                and 'episode_number' not in video_request
                and 'episode_name' not in video_request
                and not video_request.get('shuffle', false) }}
              video_content_type: "{%if 'show_name' in video_request %}episode{%else%}movie{%endif%}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(text_playlist_uri, uri) }}"
                  - condition: state
                    entity_id: !input appletv
                    state:
                      - playing
                      - paused
                sequence:
                  - if:
                      - condition: state
                        entity_id: !input appletv
                        state: paused
                    then:
                      - action: media_player.media_play
                        target:
                          entity_id: !input appletv
                alias: same video rescan
            default:
              - alias: one source at a time
                if:
                  - condition: state
                    entity_id: !input httpplayer
                    state: playing
                then:
                  - action: media_player.media_pause
                    target:
                      entity_id: !input httpplayer
              - action: media_player.turn_on
                target:
                  entity_id: !input appletv
              - if:
                  - condition: template
                    value_template: "{{ not is_state_attr(appletv, 'app_name', plex_app_name) }}"
                then:
                  - action: media_player.select_source
                    data:
                      source: !input plex_app_name
                    target:
                      entity_id: !input appletv
                  - wait_template: "{{ is_state_attr(appletv, 'app_name', plex_app_name) }}"
                    timeout:
                      seconds: 20
              - alias: wait for the Plex player to show up
                repeat:
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ plex_scan_button != '' }}"
                      then:
                        - action: button.press
                          target:
                            entity_id: "{{ plex_scan_button }}"
                    - wait_template: "{{ states(plexplayer) not in ('unavailable', 'unknown') }}"
                      timeout:
                        seconds: 6
                  until:
                    - condition: template
                      value_template: >-
                        {{ states(plexplayer) not in ('unavailable', 'unknown')
                        or repeat.index * 6 >= video_timeout|int }}
              - if:
                  - condition: template
                    value_template: "{{ states(plexplayer) in ('unavailable', 'unknown') }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: tagtuner_video_{{ device_attr(tuner_device_id, "name") }}
                      title: TagTuner video
                      message: >-
                        Plex did not show up on {{ state_attr(appletv, 'friendly_name') }} within {{ video_timeout }}s.
                        Check that Plex is installed, signed in, and has Advertise as Player turned on.

                        Tag: {{ uri }}
                  - stop: Plex player unavailable
              - action: media_player.play_media
                continue_on_error: true
                data:
                  media_content_type: "{{ video_content_type }}"
                  media_content_id: >-
                    {%if video_show_in_order %}
                      plex://{{ {'library_name': video_request.library_name, 'show.title': video_request.show_name,
                      'libtype': 'episode', 'unwatched': true, 'sort': 'originallyAvailableAt:asc',
                      'maxresults': 1, 'continuous': true, 'resume': true} | to_json }}
                    {%elif 'resume' in video_request or 'offset' in video_request %}
                      plex://{{ video_request | to_json }}
                    {%else%}
                      plex://{{ dict(video_request, resume=true) | to_json }}
                    {%endif%}
                target:
                  entity_id: !input plexplayer
              - wait_template: "{{ is_state(plexplayer, 'playing') }}"
                timeout:
                  seconds: 20
              - alias: whole show already watched, fall back to shuffle
                if:
                  - condition: template
                    value_template: "{{ video_show_in_order and not is_state(plexplayer, 'playing') }}"
                then:
                  - action: media_player.play_media
                    continue_on_error: true
                    data:
                      media_content_type: episode
                      media_content_id: "plex://{{ dict(video_request, shuffle=true) | to_json }}"
                    target:
                      entity_id: !input plexplayer
                  - wait_template: "{{ is_state(plexplayer, 'playing') }}"
                    timeout:
                      seconds: 20
              - if:
                  - condition: template
                    value_template: "{{ not is_state(plexplayer, 'playing') }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: tagtuner_video_{{ device_attr(tuner_device_id, "name") }}
                      title: TagTuner video
                      message: >-
                        Plex did not start playing this tag. Check the library name and title against Plex,
                        and the automation trace for the error.

                        Tag: {{ uri }}
        alias: tag_scanned video

      - conditions:
          - condition: template
            value_template: '{{ action == "tagScanned" and source != "" }}'
          - condition: template
            value_template: "{{ is_state(text_playlist_uri, uri) }}"
          - condition: template
            value_template: "{{ next_on_rescan == true }}"
          - condition: not
            conditions:
              - condition: state
                entity_id: !input massplayer
                state:
                  - paused
                  - idle
                for:
                  hours: 0
                  minutes: 0
                  seconds: 3
        sequence:
          - alias: play next
            choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ action == "tagScanned" and source == "sonos" and
                      trigger.event.data.playlist != "" }}
                sequence:
                  - action: media_player.media_next_track
                    target:
                      entity_id: !input httpplayer
                  - action: media_player.media_play
                    target:
                      entity_id: !input httpplayer
                alias: sonos
              - conditions:
                  - condition: template
                    value_template: '{{ action == "tagScanned" and source == "mass" }}'
                sequence:
                  - action: media_player.media_next_track
                    target:
                      entity_id: !input massplayer
                  - action: media_player.media_play
                    target:
                      entity_id: !input massplayer
                alias: mass
              - conditions:
                  - condition: template
                    value_template: '{{ action == "tagScanned" and source == "http" }}'
                sequence:
                  - action: media_player.media_next_track
                    target:
                      entity_id: !input httpplayer
                  - action: media_player.media_play
                    target:
                      entity_id: !input httpplayer
                alias: http
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ action == "tagScanned" and source not in ("sonos", "mass", "http", "") }}
                sequence:
                  - action: media_player.media_next_track
                    target:
                      entity_id: !input massplayer
                  - action: media_player.media_play
                    target:
                      entity_id: !input massplayer
                alias: try_mass
        alias: tag_scanned same rescan

      - conditions:
          - condition: template
            value_template: '{{ action == "tagScanned" and source != "" }}'
        sequence:
          - alias: one source at a time
            if:
              - condition: template
                value_template: >-
                  {{ video_enabled and is_state(appletv, 'playing')
                  and is_state_attr(appletv, 'app_name', plex_app_name) }}
            then:
              - action: media_player.media_pause
                target:
                  entity_id: !input appletv
          - parallel:
              - sequence:
                  - condition: template
                    value_template: "{{ announce_playlist == true }}"
                  - delay:
                      hours: 0
                      minutes: 0
                      seconds: 0
                      milliseconds: 100
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ trigger.event.event_type == 'tag_scanned' }}"
                        sequence:
                          - action: tts.speak
                            target:
                              entity_id: !input speaktts
                            data:
                              media_player_entity_id: !input httpplayer
                              message: "tag scanned"
                              language: !input speaktts_language
                        alias: plain
                      - conditions:
                          - condition: template
                            value_template: "{{ trigger.event.event_type != 'tag_scanned' }}"
                        sequence:
                          - action: tts.speak
                            target:
                              entity_id: !input speaktts
                            data:
                              media_player_entity_id: !input httpplayer
                              message: >-
                                {{ states(text_playlist_artist) }}
                                {{ states(text_playlist_name) }}
                              language: !input speaktts_language
                        alias: from tag
                alias: announcement
              - choose:
                  - conditions:
                      - condition: template
                        value_template: '{{ action == "tagScanned" and source == "http" and uri|contains("music.apple.com") and device_attr(httpplayer, "model")|lower|contains("echo") }}'
                    sequence:
                      - action: media_player.media_stop
                        target:
                          entity_id: !input httpplayer
                      - action: alexa_devices.send_text_command
                        data:
                          device_id: >-
                            {{ device_id(httpplayer) }}
                          text_command: >-
                            Play {{ uri.split('/')[4] }} {{ uri.split('/')[5] }} from Apple Music
                    alias: alexa & apple_music
                  - conditions:
                      - condition: template
                        value_template: '{{ action == "tagScanned" and source == "sonos" }}'
                    sequence:
                      - action: media_player.media_stop
                        target:
                          entity_id: !input httpplayer
                      - action: media_player.select_source
                        data:
                          source: "{%if trigger.event.event_type == 'tag_scanned' and trigger.event.data.name.split('://')[1] != '' %}{{ playlist }}{%else%}{{ trigger.event.data.playlist }}{%endif%}"
                        target:
                          entity_id: !input httpplayer
                    alias: sonos
                  - conditions:
                      - condition: template
                        value_template: '{{ action == "tagScanned" and source == "mass" }}'
                    sequence:
                      - action: media_player.play_media
                        data:
                          media_content_type: music
                          media_content_id: "{%if uri[-8:] == '/shuffle'%}{{ uri[0:-8] }}{%else%}{{ uri }}{%endif%}"
                        target:
                          entity_id: !input massplayer
                    alias: mass
                  - conditions:
                      - condition: template
                        value_template: '{{ action == "tagScanned" and source == "http" }}'
                    sequence:
                      - action: media_player.play_media
                        data:
                          media_content_type: music
                          media_content_id: "{%if uri[-8:] == '/shuffle'%}{{ uri[0:-8] }}{%else%}{{ uri }}{%endif%}"
                        target:
                          entity_id: !input httpplayer
                    alias: http
                  - conditions:
                      - condition: template
                        value_template: '{{ action == "tagScanned" and source not in ("sonos", "mass", "http", "") }}'
                    sequence:
                      - action: media_player.play_media
                        data:
                          media_content_type: music
                          media_content_id: "{%if uri[-8:] == '/shuffle'%}{{ uri[0:-8] }}{%else%}{{ uri }}{%endif%}"
                        target:
                          entity_id: !input massplayer
                    alias: try_mass
                alias: play
          - if:
              - condition: template
                value_template: "{{ default_volume_set == true }}"
            then:
              - action: media_player.volume_set
                data:
                  volume_level: !input default_volume
                target:
                  entity_id: !input httpplayer
          - condition: template
            value_template: "{{ shuffle_playlist == true }}"
          - wait_for_trigger:
              - trigger: state
                entity_id: !input httpplayer
                to: playing
          - action: media_player.shuffle_set
            data:
              shuffle: true
            target:
              entity_id: !input httpplayer
        alias: tag_scanned new source

      - conditions:
          - condition: template
            value_template: '{{ video_current and action in ("clickSingle", "trackNext", "trackPrevious", "volumeUp", "volumeDown") }}'
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: '{{ action == "clickSingle" }}'
                sequence:
                  - action: media_player.media_play_pause
                    target:
                      entity_id: !input appletv
              - conditions:
                  - condition: template
                    value_template: '{{ action in ("trackNext", "trackPrevious") and appletv_remote != "" }}'
                sequence:
                  - action: remote.send_command
                    data:
                      command: "{%if action == 'trackNext' %}skip_forward{%else%}skip_backward{%endif%}"
                    target:
                      entity_id: "{{ appletv_remote }}"
              - conditions:
                  - condition: template
                    value_template: '{{ action == "volumeUp" }}'
                sequence:
                  - action: media_player.volume_up
                    target:
                      entity_id: !input appletv
              - conditions:
                  - condition: template
                    value_template: '{{ action == "volumeDown" }}'
                sequence:
                  - action: media_player.volume_down
                    target:
                      entity_id: !input appletv
        alias: video controls

      - conditions:
          - condition: template
            value_template: '{{ action == "clickSingle" }}'
        sequence:
          - action: media_player.media_play_pause
            target:
              entity_id: !input httpplayer
        alias: clickSingle
      - conditions:
          - condition: template
            value_template: '{{ action == "trackNext" }}'
        sequence:
          - action: media_player.media_next_track
            target:
              entity_id: !input httpplayer
        alias: trackNext
      - conditions:
          - condition: template
            value_template: '{{ action == "trackPrevious" }}'
        sequence:
          - action: media_player.media_previous_track
            target:
              entity_id: !input httpplayer
        alias: trackPrevious
      - conditions:
          - condition: state
            entity_id: !input httpplayer
            state: "playing"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: '{{ action == "volumeUp" }}'
                  - condition: numeric_state
                    entity_id: !input httpplayer
                    attribute: volume_level
                    below: !input max_volume
                sequence:
                  - action: media_player.volume_up
                    target:
                      entity_id: !input httpplayer
                  - wait_for_trigger:
                      - trigger: media_player.volume_changed
                        target:
                          entity_id: !input httpplayer
                        options:
                          threshold:
                            type: any
                    timeout:
                      seconds: 2
              - conditions:
                  - condition: template
                    value_template: '{{ action == "volumeDown" }}'
                sequence:
                  - action: media_player.volume_down
                    target:
                      entity_id: !input httpplayer
                  - wait_for_trigger:
                      - trigger: media_player.volume_changed
                        target:
                          entity_id: !input httpplayer
                        options:
                          threshold:
                            type: any
                    timeout:
                      seconds: 2
        alias: volume
  - if:
      - condition: template
        value_template: "{{ trigger.event.event_type == 'tag_scanned' }}"
    then:
      - action: text.set_value
        data:
          value: "{{ uri|truncate(255, true, '') }}"
        target:
          entity_id: "{{ text_playlist_uri }}"
      - action: text.set_value
        data:
          value: >-
            {{ [state_attr(massplayer, 'media_artist'), state_attr(httpplayer, 'media_artist') ]|select|first|truncate(50, true, '…') }}
        target:
          entity_id: "{{ text_playlist_artist }}"
      - action: text.set_value
        data:
          value: >-
            {{ [state_attr(massplayer, 'media_album_name'), state_attr(httpplayer, 'media_album_name') ]|select|first|truncate(100, true, '…') }}
        target:
          entity_id: "{{ text_playlist_name }}"
    alias: update helpers with first song for read-only tags
  - if:
      - condition: template
        value_template: "{{ notify_version == true and trigger.event.data.magic|int(2024) < 260100 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: >-
            tagtuner_yaml_firmware_{{ device_attr(tuner_device_id, "name") }}
          title: Friendly notice
          message: >-
            {{ device_attr(tuner_device_id, "name") }} yaml firmware is outdated at v{{ trigger.event.data.magic|int(2024) }}

            Please consider upgrading for the best experience.

            https://github.com/luka6000/TagTuner

            You can disable this notification in TagTuner automation Additional settings.
    alias: version mismatch notify 1
  - if:
      - condition: template
        value_template: "{{ notify_version == true and trigger.event.data.magic|int(2024) >   blprnt_version|int }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: >-
            tagtuner_blprnt_version_{{ device_attr(tuner_device_id, "name") }}
          title: Friendly notice
          message:
            '{{this.attributes.friendly_name}} blueprint automation is outdated at v{{blprnt_version}} while
            {{ device_attr(tuner_device_id, "name") }} is at v{{ trigger.event.data.magic|int(2024) }}

            Please consider doing Re-import blueprint for the best experience.

            https://github.com/luka6000/TagTuner#using-tagtuner

