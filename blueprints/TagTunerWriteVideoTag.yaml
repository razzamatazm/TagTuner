blueprint:
  name: TagTuner write Plezy video tag
  description: >-
    Writes a plezy://watch tag for a Plex show or movie with your TagTuner.
    Paste the link from Plezy's "Show watch link" dialog (or scan its QR code
    with the TagTuner iPhone shortcut, see README), or type a title and the
    script finds it in your Plex library. Take any tag off the reader, run the
    script, then place the tag within 30 seconds. A tag left on the reader is
    skipped.
  domain: script
  input:
    tuner_id:
      name: TagTuner for ESPHome
      description: The reader that writes the tags
      selector:
        device:
          filter:
            - integration: esphome
    plex_command:
      name: Plex rest_command
      description: >-
        Optional. A rest_command that calls your Plex server with a `path`
        variable, see README. Lets the script find titles in Plex and label
        tags written from a link.
      default: ""
      selector:
        text:

fields:
  link:
    name: Watch link
    description: plezy://watch?... from Plezy's "Show watch link" dialog
    selector:
      text:
  title:
    name: Title
    description: show or movie to look up in Plex when there's no link; with a link, the label stored on the tag
    selector:
      text:
  mode:
    name: Play mode
    description: shows only, movies always resume
    default: next
    selector:
      select:
        options:
          - label: Next episode (On Deck, resumes)
            value: next
          - label: Shuffle the whole show
            value: shuffle

variables:
  tuner_device_id: !input tuner_id
  plex_command: !input plex_command
  text_playlist_uri: >-
    {{ device_entities(tuner_device_id) | select('match', '^text\..*_playlist_uri') | first }}
  text_playlist_artist: >-
    {{ device_entities(tuner_device_id) | select('match', '^text\..*_playlist_artist') | first }}
  text_playlist_name: >-
    {{ device_entities(tuner_device_id) | select('match', '^text\..*_playlist_name_or_album_title') | first }}
  button_write_tag: >-
    {{ device_entities(tuner_device_id) | select('match', '^button\..*_write_tag') | first }}
  notification_id: tagtuner_write_{{ device_attr(tuner_device_id, "name") }}
  given_link: "{{ (link | default('') | trim) | regex_replace('%2[Ff]', '/') }}"
  given_title: "{{ title | default('') | trim }}"
  shuffle: "{{ (mode | default('next') | lower) == 'shuffle' }}"
  link_plex: "{{ given_link | regex_findall('[?&]plex=([^&#]*)') }}"
  link_id: "{{ given_link | regex_findall('[?&]id=([^&#]*)') }}"
  link_server: "{{ given_link | regex_findall('[?&]server=([^&#]*)') }}"

sequence:
  - variables:
      problem: >-
        {%if given_link == '' and given_title == '' %}
          Give a watch link or a title.
        {%elif given_link == '' and plex_command == '' %}
          No watch link given and no Plex rest_command set, so "{{ given_title }}" can't be looked up.
        {%elif given_link != '' and given_link[0:14]|lower != 'plezy://watch?' %}
          "{{ given_link }}" isn't a Plezy watch link. It should start with plezy://watch?
        {%elif given_link != '' and (link_plex | length) + (link_id | length) != 1 %}
          The link needs exactly one plex= or id=.
        {%elif link_plex and link_plex[0] is not match('^(show|movie)/[0-9a-f]+$') %}
          Watch links name a whole show or a movie, not "{{ link_plex[0] }}".
        {%elif link_id and link_id[0] is not match('^[0-9]+$') %}
          "{{ link_id[0] }}" isn't a Plex rating key.
        {%endif%}
  - if:
      - condition: template
        value_template: "{{ problem | trim != '' }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "{{ notification_id }}"
          title: TagTuner video tag
          message: "{{ problem | trim }} Nothing was written."
      - stop: bad input
  - alias: look the title up in Plex, by GUID for a link, by search for a title
    if:
      - condition: template
        value_template: >-
          {{ plex_command != '' and ((given_link == '') or (link_plex and given_title == '')) }}
    then:
      - action: "{{ plex_command }}"
        data:
          path: >-
            {%if given_link == '' %}
              /hubs/search?query={{ given_title | urlencode }}&limit=10
            {%else%}
              /library/all?guid={{ ('plex://' ~ link_plex[0]) | urlencode }}&X-Plex-Container-Size=1
            {%endif%}
        response_variable: plex_result
        continue_on_error: true
  - variables:
      matches: >-
        {%set ns = namespace(found=[], items=[]) %}
        {%if plex_result is defined and plex_result.status == 200 %}
          {%set mc = plex_result.content.MediaContainer %}
          {%set ns.items = mc.Metadata | default([]) %}
          {%for hub in mc.Hub | default([]) if hub.type in ('show', 'movie') %}
            {%set ns.items = ns.items + hub.Metadata | default([]) %}
          {%endfor%}
          {%for m in ns.items if (m.guid | default('')) is match('^plex://(show|movie)/') %}
            {%set ns.found = ns.found + [{'title': m.title, 'year': m.year | default(''), 'guid': m.guid[7:]}] %}
          {%endfor%}
        {%endif%}
        {{ ns.found }}
      chosen: >-
        {%if given_link != '' %}
          {%set found = matches[0] if matches else {} %}
          {{ {'title': given_title or found.title | default(''), 'year': found.year | default(''),
              'guid': link_plex[0] if link_plex else ''} }}
        {%elif matches %}
          {{ matches[0] }}
        {%else%}
          {{ {} }}
        {%endif%}
  - if:
      - condition: template
        value_template: "{{ not chosen }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "{{ notification_id }}"
          title: TagTuner video tag
          message: >-
            No show or movie matching "{{ given_title }}" with a Plex GUID. Use the
            watch link from Plezy instead. Nothing was written.
      - stop: nothing to write
  - variables:
      tag_request: >-
        {%if chosen.guid %}
          {%set base = 'plezy://watch?plex=' ~ chosen.guid %}
        {%else%}
          {%set base = 'plezy://watch?id=' ~ link_id[0] ~ ('&server=' ~ link_server[0] if link_server else '') %}
        {%endif%}
        {{ base ~ ('&mode=shuffle' if shuffle and chosen.guid[0:6] != 'movie/' else '') }}
  - alias: the title on the tag is a label for people, playback only uses the link
    action: text.set_value
    data:
      value: "{{ chosen.title | truncate(20, true, '…') }}"
    target:
      entity_id: "{{ text_playlist_artist }}"
  - alias: left empty, a 20 character label and a shuffle link just fit an NTAG213
    action: text.set_value
    data:
      value: ""
    target:
      entity_id: "{{ text_playlist_name }}"
  - action: text.set_value
    data:
      value: "{{ tag_request }}"
    target:
      entity_id: "{{ text_playlist_uri }}"
  - action: button.press
    target:
      entity_id: "{{ button_write_tag }}"
  - action: persistent_notification.create
    data:
      notification_id: "{{ notification_id }}"
      title: TagTuner video tag
      message: >-
        Writing {{ chosen.title or 'the link' }}{{ ' (' ~ chosen.year ~ ')' if chosen.year and chosen.year|string not in chosen.title }}
        as {{ tag_request }}. Place the tag on the reader within 30 seconds.
        {%if given_link == '' and matches | length > 1 %}

        Other matches, run again with their Plezy watch link if this is the wrong one:
        {%for m in matches[1:] %}
        - {{ m.title }}{{ ' (' ~ m.year ~ ')' if m.year and m.year|string not in m.title }}
        {%endfor%}
        {%endif%}
mode: single
