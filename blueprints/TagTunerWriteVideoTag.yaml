blueprint:
  name: TagTuner write Infuse video tag
  description: >-
    Builds an infuse:// tag for a movie, show or episode and writes it with
    your TagTuner. Find the TMDB id in the address on themoviedb.org, e.g.
    themoviedb.org/tv/82728-bluey is 82728. Take any tag off the reader, run
    the script, then place the tag within 30 seconds. A tag left on the
    reader is skipped.
  domain: script
  input:
    tuner_id:
      name: TagTuner for ESPHome
      description: The reader that writes the tags
      selector:
        device:
          filter:
            - integration: esphome

fields:
  kind:
    name: Kind
    required: true
    default: show
    selector:
      select:
        options:
          - label: Movie
            value: movie
          - label: Whole show, next unwatched episode
            value: show
          - label: One episode
            value: episode
  tmdb_id:
    name: TMDB id
    description: the number in the themoviedb.org address
    required: true
    selector:
      number:
        min: 1
        max: 99999999
        mode: box
  title:
    name: Title
    description: shown on the reader's device page, not used for playback
    selector:
      text:
  season:
    name: Season
    description: one episode only
    selector:
      number:
        min: 0
        max: 100
        mode: box
  episode:
    name: Episode
    description: one episode only
    selector:
      number:
        min: 1
        max: 1000
        mode: box

variables:
  tuner_device_id: !input tuner_id
  tag_request: >-
    {%if kind == 'movie' %}
      infuse://movie/{{ tmdb_id|int }}
    {%elif kind == 'episode' %}
      infuse://series/{{ tmdb_id|int }}-{{ season|int }}-{{ episode|int }}
    {%else%}
      infuse://series/{{ tmdb_id|int }}
    {%endif%}
  text_playlist_uri: >-
    {{ device_entities(tuner_device_id) | select('match', '^text\..*_playlist_uri') | first }}
  text_playlist_artist: >-
    {{ device_entities(tuner_device_id) | select('match', '^text\..*_playlist_artist') | first }}
  text_playlist_name: >-
    {{ device_entities(tuner_device_id) | select('match', '^text\..*_playlist_name_or_album_title') | first }}
  button_write_tag: >-
    {{ device_entities(tuner_device_id) | select('match', '^button\..*_write_tag') | first }}

sequence:
  - condition: template
    value_template: "{{ kind != 'episode' or (season|default(none) is not none and episode|default(none) is not none) }}"
  - action: text.set_value
    data:
      value: "{{ title|default('', true)|truncate(50, true, '…') }}"
    target:
      entity_id: "{{ text_playlist_artist }}"
  - action: text.set_value
    data:
      value: >-
        {%if kind == 'episode' %}S{{ season|int }}E{{ episode|int }}{%else%}{{ title|default('', true)|truncate(100, true, '…') }}{%endif%}
    target:
      entity_id: "{{ text_playlist_name }}"
  - action: text.set_value
    data:
      value: "{{ tag_request }}"
    target:
      entity_id: "{{ text_playlist_uri }}"
  - action: button.press
    target:
      entity_id: "{{ button_write_tag }}"
mode: single
