packages:
  # project: github://luka6000/TagTuner/tagtuner-project.yaml@main
  # core-nfc: github://luka6000/TagTuner/tagtuner-core-nfc.yaml@main
  # core-comms: github://luka6000/TagTuner/tagtuner-core-comms.yaml@main
  project: !include tagtuner-project.yaml
  core-nfc: !include tagtuner-core-nfc.yaml
  core-comms: !include tagtuner-core-comms.yaml

# ESPHome 2026.10.1's pn532 and pn532_i2c, kept as a pair so they match, with page retries, write retries and debounced tag removal,
# see components/pn532
external_components:
  - source: github://razzamatazm/TagTuner@xiao-buttons
    components: [pn532, pn532_i2c]
    refresh: 0d

esphome:
  name: "${name}"
  friendly_name: ${friendly_name}
  # Automatically add the mac address to the name
  # so you can use a single firmware for all devices
  name_add_mac_suffix: true

  # hello world
  on_boot:
    priority: -100
    then:
    - light.turn_on:
        id: led1
        effect: TagWrite
    - delay: 1000ms
    - light.turn_off: led1
    - wait_until:
        condition:
          api.connected:
        timeout: 20s
    - text_sensor.template.publish:
        id: status
        state: "Ready"

esp32:
  board: seeed_xiao_esp32c6
  watchdog_timeout: 15s
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: 'Y'
      CONFIG_PM_DFS_INIT_AUTO: 'Y'
      CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ_80: 'Y'

# To be able to get logs from the device via serial and api.
logger:
  # level: VERBOSE
  level: DEBUG
  # level: WARN
  logs:
    light: WARN
    # pn532: DEBUG
    # pn532_i2c: DEBUG

i2c:
  id: bus_i2c
  sda: 22 #D4
  scl: 23 #D5
  scan: False
  frequency: 100kHz
  timeout: 13ms #to prevent pn532 timeout

binary_sensor:
  - platform: gpio
    id: toggle
    use_interrupt: false
    pin:
      number: 18 #D10
      inverted: true
      mode:
        input: true
        pullup: true
    on_multi_click:
    - timing:
        - ON for at most 1s
        - OFF for at most 0.25s
        - ON for at most 1s
        - OFF for at most 0.25s
        - ON for at most 1s
      then:
        - script.execute:
            id: click_event
            action: "clickTriple"
    - timing:
        - ON for at most 1s
        - OFF for at most 0.25s
        - ON for at most 1s
        - OFF for at least 0.25s
      then:
        - script.execute:
            id: click_event
            action: "clickDouble"
    - timing:
        - ON for 0.5s to 2s
        - OFF for at least 50ms
      then:
        - script.execute:
            id: click_event
            action: "clickLong"
    - timing:
        - ON for at most 0.5s
        - OFF for at least 260ms
      then:
        - script.execute:
            id: click_event
            action: "clickSingle"
  # tactile skip buttons, wired between the pin and GND
  - platform: gpio
    id: button_next
    use_interrupt: false
    pin:
      number: 21 #D3
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 20ms
    on_press:
      - script.execute:
          id: skip_event
          forward: true
  - platform: gpio
    id: button_previous
    use_interrupt: false
    pin:
      number: 2 #D2
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 20ms
    on_press:
      - script.execute:
          id: skip_event
          forward: false

output:
  - platform: gpio
    pin: 15
    inverted: true
    id: led1_gpio

light:
  - platform: binary
    id: led1
    output: led1_gpio
    restore_mode: ALWAYS_OFF
    effects:
      - strobe:
          name: TagWrite
          colors:
            - state: true
              duration: 250ms
            - state: false
              duration: 50ms

globals:
  # detents and clicks sent in the current knob spin
  - id: knob_detents
    type: int
    initial_value: '0'
  - id: knob_clicks
    type: int
    initial_value: '0'

script:
  - id: click_event
    parameters:
      action: string
    then:
    - script.execute: led_blink
    - text_sensor.template.publish:
        id: status
        state: !lambda return action;
    - script.execute:
        id: tagtuner_event
        action: !lambda return action;
        uid: ""
        uri: ""
        artist: ""
        playlist: ""
  - id: skip_event
    parameters:
      forward: bool
    then:
    - script.execute: led_blink
    - text_sensor.template.publish:
        id: status
        state: !lambda 'return forward ? "Next track" : "Previous track";'
    - script.execute:
        id: tagtuner_event
        action: !lambda 'return forward ? "trackNext" : "trackPrevious";'
        uid: ""
        uri: ""
        artist: ""
        playlist: ""
  # the knob only sets volume, skips are on the buttons.
  # A spin sends one click right away and a second if it carries on past
  # a few detents, so a kid spinning hard can't flood HA with volume steps.
  - id: knob_event
    parameters:
      clockwise: bool
    then:
    - lambda: |-
        int dir = clockwise ? 1 : -1;
        // turning back the other way starts a new spin
        if (id(knob_detents) * dir < 0) {
          id(knob_detents) = 0;
          id(knob_clicks) = 0;
        }
        id(knob_detents) += dir;
    - script.execute: knob_spin_end
    - if:
        condition:
          lambda: |-
            return id(knob_clicks) == 0
              || (id(knob_clicks) == 1 && abs(id(knob_detents)) >= 4);
        then:
          - lambda: 'id(knob_clicks) += 1;'
          - script.execute:
              id: knob_click
              clockwise: !lambda return clockwise;
  # the spin ends once the knob has been still for a moment
  - id: knob_spin_end
    mode: restart
    then:
    - delay: 400ms
    - lambda: |-
        id(knob_detents) = 0;
        id(knob_clicks) = 0;
  - id: knob_click
    parameters:
      clockwise: bool
    then:
    - text_sensor.template.publish:
        id: status
        state: !lambda 'return clockwise ? "Volume up" : "Volume down";'
    - script.execute:
        id: tagtuner_event
        action: !lambda 'return clockwise ? "volumeUp" : "volumeDown";'
        uid: ""
        uri: ""
        artist: ""
        playlist: ""
    - script.execute: led_blink
  - id: led_blink
    then:
    - light.turn_off: led1
    - light.turn_on:
        id: led1
        flash_length: 100ms
  - id: led_ok
    then:
    - light.turn_off: led1
    - light.turn_on:
        id: led1
        flash_length: 50ms
    - delay: 100ms
    - light.turn_on:
        id: led1
        flash_length: 50ms
  - id: led_success
    then:
    - light.turn_off: led1
    - light.turn_on:
        id: led1
        flash_length: 200ms
    - delay: 250ms
    - light.turn_on:
        id: led1
        flash_length: 200ms
    - delay: 250ms
    - light.turn_on:
        id: led1
        flash_length: 500ms
  - id: led_tagwrite
    then:
    - light.turn_on:
        id: led1
        effect: TagWrite

sensor:
  - platform: rotary_encoder
    id: rotary
    pin_a:
      number: 19 #D8
      mode:
        input: true
        pullup: true
    pin_b:
      number: 20 #D9
      mode:
        input: true
        pullup: true
    resolution: 2
    restore_mode: ALWAYS_ZERO
    on_clockwise:
      - script.execute:
          id: knob_event
          clockwise: true
    on_anticlockwise:
      - script.execute:
          id: knob_event
          clockwise: false
